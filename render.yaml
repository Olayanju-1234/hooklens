databases:
  - name: hookdash-db
    plan: free
    databaseName: hookdash
    user: hookdash

services:
  - type: web
    name: hookdash-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hookdash-db
          property: connectionString
      - key: REDIS_URL
        sync: false # Paste your Upstash Redis URL here after deploy
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://hookdash-web.onrender.com
      - key: PORT
        value: 3000
    healthCheckPath: /api/health

  - type: web
    name: hookdash-web
    runtime: docker
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://hookdash-api.onrender.com/api
      - key: NEXT_PUBLIC_WS_URL
        value: https://hookdash-api.onrender.com
      - key: PORT
        value: 3001
